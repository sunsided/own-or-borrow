# Publishes own_or_borrow when release-plz pushes its vX.Y.Z tag.
# Runs in the `crates-io` environment, which only allows v*.*.* tags.
# crates.io trusted publishing is bound to this file name and environment: do not rename either.
name: Publish

on:
  push:
    tags:
      # SemVer 2.0 releases and pre-releases (v1.2.0, v1.2.0-rc.1).
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  verify:
    name: verify tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest
      # Same feature sets as FEATURE_SETS in the Taskfile and the ci.yml matrix.
      - name: clippy and tests for every feature set
        run: |
          for features in --features=std --all-features --no-default-features; do
            cargo clippy --workspace --all-targets "$features" --locked -- -D warnings
            cargo nextest run --workspace "$features" --locked
            cargo test --workspace --doc "$features" --locked
          done

  crates-io:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/${{ steps.crate.outputs.name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Resolve crate and version from the tag
        id: crate
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*) name="own_or_borrow"; version="${GITHUB_REF_NAME#v}" ;;
            *) echo "::error::unexpected tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
          actual="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')"
          if [ "$actual" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $name $actual"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Skip versions that are already on crates.io
        id: check
        # The first release of a crate is published by hand, and re-runs must be harmless.
        run: |
          # 200: published, 404: not yet. Anything else (rate limit, outage) after the retries
          # fails the job instead of guessing, so a re-run never publishes on a wrong answer.
          status="$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors \
            -A "$GITHUB_REPOSITORY publish workflow" \
            "https://crates.io/api/v1/crates/$CRATE/$VERSION")"
          case "$status" in
            200)
              echo "::notice::$CRATE $VERSION is already on crates.io; nothing to publish"
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404) ;;
            *)
              echo "::error::crates.io answered HTTP $status for $CRATE $VERSION"
              exit 1
              ;;
          esac
        env:
          CRATE: ${{ steps.crate.outputs.name }}
          VERSION: ${{ steps.crate.outputs.version }}
      - if: steps.check.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: cargo publish -p "$CRATE" --locked
        env:
          CRATE: ${{ steps.crate.outputs.name }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
