[package]
name = "own_or_borrow"
description = "Unified references to owned, mutably borrowed or RefCell borrowed data"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
version = "0.2.0"
categories = ["no-std", "no-std::no-alloc", "embedded"]
keywords = ["refcell", "embedded"]
repository = "https://github.com/sunsided/own-or-borrow"
license = "EUPL-1.2"
edition = "2024"
rust-version = "1.85"

[features]
default = ["std"]
# No effect; kept for backwards compatibility. The crate is always `no_std`.
std = []
defmt = ["dep:defmt"]

[dependencies]
defmt = { version = "1.0.1", optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
